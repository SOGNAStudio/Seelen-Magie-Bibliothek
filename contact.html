<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kontakt · SeelenMagie-Bibliothek</title>
<meta name="description" content="Schreib uns eine Nachricht – wir melden uns innerhalb von 24 Stunden.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<header class="site-header" id="site-header"></header>
<main class="container" style="padding-top:4.5rem; padding-left: 8rem; padding-right: 8rem">
  <div class="page-head"><p class="eyebrow">Kontakt</p><h1>Schreib uns eine Nachricht</h1></div>
  <div class="contact-grid">
    <form id="contact-form">
      <div class="form-grid" style="margin-bottom:1rem">
        <div class="field"><label>Name</label><input class="field-input" required></div>
        <div class="field"><label>E-Mail</label><input class="field-input" type="email" required></div>
      </div>
      <div class="field" style="margin-bottom:1rem"><label>Betreff</label><input class="field-input" required></div>
      <div class="field" style="margin-bottom:1.25rem"><label>Nachricht</label><textarea class="field-input textarea" rows="6" required></textarea></div>
      <button type="submit" class="btn btn-primary" style="font-size: 1.2rem; width: 11rem;">Senden</button>
    </form>
    <aside>
      <div class="contact-info-card">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 7-8 13-8 13s-8-6-8-13a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <div><div class="label">Studio</div><div class="value">Mondgasse 7<br>8000 Zürich</div></div>
      </div>
      <div class="contact-info-card">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <div><div class="label">Telefon</div><div class="value"><a href="tel:+41441234567">+41 44 123 45 67</a></div></div>
      </div>
      <div class="contact-info-card">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
        <div><div class="label">E-Mail</div><div class="value"><a href="mailto:noreply@example.com">noreply@example.com</a></div></div>
      </div>
    </aside>
  </div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="js/products.js"></script>
<script src="js/app.js"></script>
</body>
</html>

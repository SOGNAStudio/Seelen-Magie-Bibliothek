<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Readings & Sessions · SeelenMagie-Bibliothek</title>
<meta name="description" content="Stöbere durch unsere Bibliothek spiritueller Dienste – Tarot, Astrologie, Aura, Channeling und mehr.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">
<header class="site-header" id="site-header"></header>

<main class="container" style="padding-top:5rem">
  <div class="page-head">
    <p class="eyebrow">Readings & Sessions</p>
    <h1>Finde dein Reading</h1>
    <p>Stöbere durch unsere Bibliothek spiritueller Dienste. Filter, sortiere und finde genau das, was deine Seele gerade braucht.</p>
  </div>

  <div class="shop-bar">
    <div class="search-input-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="shop-search" class="input" placeholder="Suche nach Tarot, Aura, Liebe…">
    </div>
    <select id="sort-select" class="select">
      <option value="featured">Empfohlen</option>
      <option value="price-asc">Preis ↑</option>
      <option value="price-desc">Preis ↓</option>
      <option value="rating">Beste Bewertung</option>
      <option value="duration">Kürzeste Dauer</option>
    </select>
    <button id="filter-toggle" class="icon-btn filter-toggle-btn" aria-label="Filter" onclick="document.getElementById('filter-sidebar').classList.toggle('active')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
    </button>
    <div class="view-toggle">
      <button data-view="grid" class="active" aria-label="Raster"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></button>
      <button data-view="list" aria-label="Liste"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
    </div>
  </div>

  <div class="shop-layout">
    <aside id="filter-sidebar" class="filter-sidebar"></aside>
    <div>
      <div style="display:flex;justify-content:space-between;margin-bottom:1rem;color:var(--muted);font-size:.9rem">
        <span id="result-count">…</span>
      </div>
      <div id="product-results" class="product-grid"></div>
    </div>
  </div>

  <section id="bewertungen" style="margin-top:5rem">
    <div class="section-head">
      <div>
        <p class="eyebrow">Stimmen unserer Klient:innen</p>
        <h2>Bewertungen</h2>
      </div>
    </div>
    <div class="reviews-grid" id="reviews-grid"></div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<script src="js/products.js"></script>
<script src="js/app.js"></script>
</body>
</html>
